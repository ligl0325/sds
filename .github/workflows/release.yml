name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-gnu:
    name: Linux x86_64 GNU release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
      - run: cargo build --release
      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/sds target/release/sds-mcp dist/package/
          tar -C dist/package -czf dist/sds-linux-x86_64-gnu.tar.gz sds sds-mcp
          sha256sum dist/sds-linux-x86_64-gnu.tar.gz > dist/sds-linux-x86_64-gnu.tar.gz.sha256
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sds-linux-x86_64-gnu.tar.gz
            dist/sds-linux-x86_64-gnu.tar.gz.sha256
